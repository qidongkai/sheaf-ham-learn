model:
  kind: HatanoNelson
  N: 8
  periodic: false
  params: {tR: 1.0, tL: 0.3}
sheaf: {site_dim: 1}
gnn: {feat_dim: 8, hidden: 32, n_layers: 2, equivariant: true}
train:
  lr: 1.0e-3
  epochs: 200
  batch_size: 16
  lam: 0.1
  mu: 0.05
  lam_chain: 1.0e-4
  eps_scale: 1.0e-3
  recon_mode: frobenius
  seed: 0